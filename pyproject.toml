[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyResDMD"
version = "0.1.0"
description = "Implementation of ResDMD in PyTorch, including learned dictionaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.11.0",
    "numpy>=2.4.3",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pyresdmd*"]
